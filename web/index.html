<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrafficController</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2933;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(900px, calc(100% - 32px));
      background: white;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    select, button {
      border-radius: 6px;
      padding: 12px;
      font-size: 15px;
    }

    select {
      min-width: 260px;
      border: 1px solid #bcccdc;
      background: #f8fafc;
    }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: wait;
    }

    video, canvas {
      width: 100%;
      max-height: 520px;
      background: #111827;
      border-radius: 8px;
      object-fit: contain;
      border: 1px solid #d9e2ec;
    }

    canvas {
      display: none;
      margin-top: 16px;
    }

    .result {
      margin-top: 16px;
      padding: 16px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #d9e2ec;
      white-space: pre-line;
    }

    .error {
      color: #b91c1c;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <h1>TrafficController</h1>

    <div class="controls">
      <select id="cameraSelect"></select>
      <button id="startButton" type="button">Iniciar camera</button>
      <button id="captureButton" type="button" disabled>Tirar foto e analisar</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="result" class="result">Escolha uma camera e inicie a captura.</div>
  </main>

  <script>
    const cameraSelect = document.getElementById("cameraSelect");
    const startButton = document.getElementById("startButton");
    const captureButton = document.getElementById("captureButton");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const result = document.getElementById("result");

    let stream = null;

    async function listCameras() {
      await navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(tempStream => {
          tempStream.getTracks().forEach(track => track.stop());
        });

      const devices = await navigator.mediaDevices.enumerateDevices();
      const cameras = devices.filter(device => device.kind === "videoinput");

      cameraSelect.innerHTML = "";

      cameras.forEach((camera, index) => {
        const option = document.createElement("option");
        option.value = camera.deviceId;
        option.textContent = camera.label || `Camera ${index + 1}`;
        cameraSelect.appendChild(option);
      });

      if (cameras.length === 0) {
        result.textContent = "Nenhuma camera encontrada.";
        result.classList.add("error");
      }
    }

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      const deviceId = cameraSelect.value;

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      captureButton.disabled = false;
      result.textContent = "Camera ativa.";
      result.classList.remove("error");
    }

    function captureFrameBlob() {
      const width = video.videoWidth;
      const height = video.videoHeight;

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, width, height);

      return new Promise(resolve => {
        canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.95);
      });
    }

    async function captureAndAnalyze() {
      captureButton.disabled = true;
      result.textContent = "Analisando imagem...";
      result.classList.remove("error");

      try {
        const blob = await captureFrameBlob();

        if (!blob) {
          throw new Error("Nao foi possivel capturar a imagem.");
        }

        const formData = new FormData();
        formData.append("file", blob, "camera.jpg");

        const response = await fetch("/predict", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Erro ao analisar imagem.");
        }

        const arduinoStatus = data.arduino_sent
          ? "Tempos enviados ao Arduino"
          : `Falha ao enviar ao Arduino: ${data.arduino_error}`;

        result.textContent =
          `Classe detectada: ${data.class_id}\n` +
          `Carros na direita: ${data.right_cars}\n` +
          `Carros embaixo/esquerda: ${data.bottom_cars}\n` +
          `Verde direita: ${data.right_green}s\n` +
          `Verde esquerda/baixo: ${data.bottom_green}s\n` +
          arduinoStatus;

      } catch (error) {
        result.textContent = error.message;
        result.classList.add("error");
      } finally {
        captureButton.disabled = false;
      }
    }

    startButton.addEventListener("click", startCamera);
    captureButton.addEventListener("click", captureAndAnalyze);

    listCameras().catch(error => {
      result.textContent = error.message;
      result.classList.add("error");
    });
  </script>
</body>
</html>
